# Initialize from the fixed-source pretrained model; budgets: 100, 500, 2000.
# Targets: tu_COX2, tu_DHFR, tu_PROTEINS, tu_IMDB-BINARY, ogb_ogbg-code2.
# Split seed 1729; training seeds 0, 1, 2.
experiment_type: fine_tune
train_datasets: null
train_pair_budget: null
init_from: null
dataset_config: configs/datasets/default.yaml
node_label_encoding: fixed_one_hot
node_label_dim: 97
val_ratio: 0.04
test_ratio: 0.16
split_seed: 1729
seed: 0
output_dir: experiments
runtime_config:
  epochs: 3000
  batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  weight_decay: 0.0
  device: cuda:0
  params:
    criterion: mse
    monitor: mse
    loss: mse
    num_iters: 100
    warmup: 10
    eval_batch_size: 2048
    log_interval: 1
    save_best: true
    load_best_at_end: true
    early_stopping: true
    early_stopping_patience: 50
    early_stopping_min_delta: 0.0
    verbose: true
