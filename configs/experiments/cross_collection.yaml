# Fixed seven-source pretraining; split/train seed 1729/0.
experiment_type: cross_collection
name: fixed_sources
train_datasets: [tu_AIDS, tu_BZR, tu_ENZYMES, tu_MUTAG, tu_NCI1, tu_PTC_MR, ged_pyg_LINUX]
test_datasets: [tu_COX2, tu_DHFR, tu_PROTEINS, tu_IMDB-BINARY, ogb_ogbg-code2]
dataset_config: configs/datasets/default.yaml
node_label_encoding: fixed_one_hot
node_label_dim: 97
val_ratio: 0.04
test_ratio: 0.16
split_seed: 1729
seed: 0
output_dir: experiments
runtime_config:
  epochs: 3000
  batch_size: 128
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  weight_decay: 0.0
  device: cuda:0
  params:
    criterion: mse
    monitor: mse
    loss: mse
    num_iters: 100
    warmup: 2
    eval_batch_size: 2048
    log_interval: 1
    save_best: true
    load_best_at_end: true
    early_stopping: true
    early_stopping_patience: 20
    early_stopping_min_delta: 0.0
    verbose: true
